# omp-config — agent settings (HIGHLY OPTIMIZED)
# Resolved from ~/.omp/agent/config.yml (see `omp config list` for every valid key).
#
# This is a tuned, speed-first profile: OpenRouter-only routing, curated model
# roles, aggressive-but-safe fallback chains, tuned thinking budgets, and
# snapcompact context management — low latency and low token waste while
# keeping frontier reasoning on tap.
#
# NOTE: omp writes settings changes back THROUGH the symlink (stripping these
# comments), so UI tweaks land as a dirty diff in this repo. Keep what you
# want (commit it) or restore the curated file (git checkout config.yml);
# `./install.sh doctor` warns when the tree has drifted.
#
# Frontier reasoning: the slow/plan roles default to the open-weight
# DeepSeek V4 Pro 0813 (near-Opus reasoning at ~1/6 the price). Prefer the
# closed frontier? Change both roles below to openrouter/anthropic/claude-opus-5 — it is
# already pinned in models.yml and wired as their first fallback.

# ---------------------------------------------------------------------------
# Model roles: which model each agent responsibility uses.
# Role values may carry a thinking suffix (:minimal :low :medium :high :xhigh
# :max) and may alias another role with "@role" (e.g. "@smol").
# ---------------------------------------------------------------------------
modelRoles:
  # Default model for general turns and the main agent loop.
  default: openrouter/anthropic/claude-sonnet-5
  # Small/fast model for lightweight background tasks (titles, memory, etc).
  smol: openrouter/deepseek/deepseek-v4-flash-0731
  # Slow/frontier model for hard problems and deep reasoning (0813 GA build).
  slow: openrouter/deepseek/deepseek-v4-pro-0813:high
  # Planning model for scoping and architecture (0813 GA build).
  plan: openrouter/deepseek/deepseek-v4-pro-0813
  # Vision model for image understanding (screenshots, diagrams, UI).
  vision: openrouter/google/gemini-3.7-flash
  # Advisor: second model that reviews each turn and injects advice.
  # Deliberately a DIFFERENT family than `default` — a diverse reviewer
  # catches mistakes a same-model reviewer rubber-stamps — and cheaper per
  # token than running Sonnet twice.
  advisor: openrouter/deepseek/deepseek-v4-pro-0813:low
  # Design/frontend tasks — Sonnet pairs vision with the strongest UI taste.
  designer: openrouter/anthropic/claude-sonnet-5
  # Commit messages — cheap and fast; no reasoning needed.
  commit: "@smol"
  # Micro-tasks (online titles, memory, classifiers).
  tiny: "@smol"
  # Custom role: uncensored/steerable open-weight writing + analysis.
  # Select it from the model picker ("Uncensored") or with @uncensored.
  # Hermes 4 70B is bundled and resolves deterministically; the 405B model
  # is currently absent from omp's usable catalog and returns "Model not found".
  uncensored: openrouter/nousresearch/hermes-4-70b
  # `task` (subagents) is deliberately unset: subtasks inherit the session's
  # active model, which is almost always what you want.

# Selector metadata for custom roles (built-ins already have names/colors).
modelTags:
  uncensored:
    name: Uncensored
    color: accent

# Order the model switcher cycles through.
cycleOrder:
  - smol
  - default
  - slow

# ---------------------------------------------------------------------------
# Advisor: a second model reviews each turn and injects advice before the
# main model commits to a plan. Wired to the `advisor` role above (a cheaper
# DeepSeek reviewer — a DIFFERENT family than Sonnet, so it catches mistakes
# a same-model reviewer would rubber-stamp). Off by default in omp; enabled
# here because the role + fallback chain are already curated.
# ---------------------------------------------------------------------------
advisor:
  enabled: true
  syncBacklog: "off"

# ---------------------------------------------------------------------------
# Thinking: default effort and per-level token budgets.
# Claude 5 models use adaptive thinking (effort levels), not token budgets;
# these budgets still apply to budget-based models (DeepSeek, GLM, etc).
# ---------------------------------------------------------------------------
defaultThinkingLevel: high
thinkingBudgets:
  minimal: 1024
  low: 2048
  medium: 8192
  high: 16384
  xhigh: 32768
  max: 32768

# ---------------------------------------------------------------------------
# Model prompt context: give the agent a richer view of its environment.
# includeWorkspaceTree injects the repo file tree into the system prompt so
# the model can navigate without a round-trip of glob/read calls.
# ---------------------------------------------------------------------------
includeWorkspaceTree: true

# ---------------------------------------------------------------------------
# Retry + fallback: automatic step-down when a model errors or rate-limits.
# Roles without an explicit chain inherit "default" (designer).
# ---------------------------------------------------------------------------
retry:
  enabled: true
  maxRetries: 10
  baseDelayMs: 500
  maxDelayMs: 300000
  modelFallback: true
  # Prefer a model with available capacity over a merely earlier fallback.
  usageAwareFallback: true
  usageReservePct: 10
  usageReservePolicy: confirm
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - openrouter/anthropic/claude-sonnet-5
      - openrouter/deepseek/deepseek-v4-pro-0813
      - openrouter/z-ai/glm-5.3
    slow:
      - openrouter/deepseek/deepseek-v4-pro-0813
      - openrouter/anthropic/claude-opus-5
      - openrouter/anthropic/claude-sonnet-5
    plan:
      - openrouter/deepseek/deepseek-v4-pro-0813
      - openrouter/anthropic/claude-opus-5
      - openrouter/anthropic/claude-sonnet-5
    advisor:
      - openrouter/deepseek/deepseek-v4-pro-0813
      - openrouter/anthropic/claude-sonnet-5
    # Background roles fall back to cheap multimodal Flash, never to the
    # frontier — a dead smol endpoint should not silently burn Opus money.
    smol:
      - openrouter/deepseek/deepseek-v4-flash-0731
      - openrouter/google/gemini-3.7-flash
    commit:
      - openrouter/deepseek/deepseek-v4-flash-0731
      - openrouter/google/gemini-3.7-flash
    tiny:
      - openrouter/deepseek/deepseek-v4-flash-0731
      - openrouter/google/gemini-3.7-flash
    vision:
      - openrouter/google/gemini-3.7-flash
      - openrouter/anthropic/claude-sonnet-5
    # Uncensored stays uncensored — never silently fall back to an aligned
    # frontier model (which would refuse the exact prompts this role is for).
    uncensored:
      - openrouter/nousresearch/hermes-4-70b

# ---------------------------------------------------------------------------
# Service providers (non-LLM): web search.
# Exa first — best agent-grade search; works keyless via its MCP fallback and
# upgrades automatically when EXA_API_KEY is set in .env. Credential-free
# scrapers (Startpage/Ecosia/DuckDuckGo) remain as backups; without this
# ordering omp lands directly on the scrapers, which get bot-challenged.
# ---------------------------------------------------------------------------
providers:
  webSearchOrder:
    - exa
    - startpage
    - ecosia
    - duckduckgo

# ---------------------------------------------------------------------------
# Message queue: how concurrent steering/follow-up/interrupts are drained.
# one-at-a-time keeps the agent focused and avoids racing tool calls.
# ---------------------------------------------------------------------------
steeringMode: one-at-a-time
followUpMode: one-at-a-time
interruptMode: immediate

# ---------------------------------------------------------------------------
# Tools and approvals.
# ---------------------------------------------------------------------------
tools:
  format: auto
  approvalMode: yolo
  maxTimeout: 0
  intentTracing: true

# MCP: keep prompts small by loading project config on demand and rendering
# non-JSON results as Markdown. (MCP tools are already discovered on demand
# by default; there is no separate "lazy discovery" toggle.)
mcp:
  enableProjectConfig: true
  renderMarkdownResults: true

# Individual built-in tools.
bash:
  enabled: true
  # Auto-background commands that run >60s (builds, test suites) so the agent
  # keeps working instead of blocking the loop on a long command.
  autoBackground:
    enabled: true
    thresholdMs: 60000

# Intercept shell commands that duplicate built-in tools (cat/head/tail →
# read, grep/rg → grep, find/fd → glob) and redirect them to the proper tool,
# which respects .gitignore and returns structured output. omp ships the
# patterns; this just turns the interceptor on.
bashInterceptor:
  enabled: true

# Detect when a model stops mid-generation (truncated output) and recover
# with the tiny/unexpectedStop model instead of silently returning a cut-off
# answer.
features:
  unexpectedStopDetection: true

# Pre-walk the repo before the agent acts so it has a mental map of the
# project layout up front (fewer wasted glob/read round-trips).
prewalk:
  enabled: true

# Per-task behavior toggles. These are the switches that actually drive the
# agent loop (the `prewalk`/`lsp` blocks above are the global gates).
task:
  # Walk the repo tree before the first action so the model navigates without
  # a burst of glob/read round-trips.
  prewalk: true
  # Enable LSP (language-server) integration: real type/compile diagnostics
  # and go-to-definition instead of the model guessing. The `lsp` block above
  # is already configured; this turns it on per-task.
  enableLsp: true
  # Expose effort levels (minimal→max) so the model can self-select how hard
  # to think per task instead of always running at the default.
  enableEffort: true

eval:
  py: true
  js: true

lsp:
  enabled: true
  lazy: true
  diagnosticsOnWrite: true
  diagnosticsOnEdit: false
  formatOnWrite: false

edit:
  mode: hashline
  fuzzyMatch: true
  fuzzyThreshold: 0.95
  blockAutoGenerated: true

read:
  defaultLimit: 300
  summarize:
    enabled: true
    prose: false

grep:
  enabled: true

glob:
  enabled: true

fetch:
  enabled: true

web_search:
  enabled: true

browser:
  enabled: true

# ---------------------------------------------------------------------------
# Context compaction: keep long sessions alive without blowing the window.
# snapcompact = fast, lossless-ish snapshot compaction (lowest latency).
# ---------------------------------------------------------------------------
compaction:
  enabled: true
  strategy: snapcompact
  reserveTokens: 16384
  keepRecentTokens: 20000
  autoContinue: true
  idleEnabled: false
  midTurnEnabled: true
  thresholdPercent: 80
  thresholdTokens: -1
  remoteEnabled: true

# Promote important context (files the agent keeps revisiting, key decisions)
# so it survives compaction instead of being summarized away.
contextPromotion:
  enabled: true

# ---------------------------------------------------------------------------
# Memory. ("off" is quoted deliberately — bare `off` is a YAML 1.1 boolean.)
# ---------------------------------------------------------------------------
memory:
  backend: "off"

# ---------------------------------------------------------------------------
# Runtime stamps written by omp itself (kept so setup doesn't re-prompt).
# ---------------------------------------------------------------------------
symbolPreset: unicode
theme:
  light: light
setupVersion: 1
