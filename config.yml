# omp-config — agent settings
# Resolved from ~/.omp/agent/config.yml (see `omp config list` for every valid key).

# ---------------------------------------------------------------------------
# Model roles: which model each agent responsibility uses.
# Role values may carry a thinking suffix: :minimal :low :medium :high :xhigh :max
# ---------------------------------------------------------------------------
modelRoles:
  # Default model for general turns and the main agent loop.
  default: anthropic/claude-sonnet-5
  # Small/fast model for lightweight background tasks (titles, memory, etc).
  smol: deepseek/deepseek-v4-flash-0731
  # Slow/frontier model for hard problems and deep reasoning.
  slow: anthropic/claude-opus-5:high
  # Planning model for scoping and architecture.
  plan: anthropic/claude-opus-5
  # Vision model for image understanding.
  vision: google/gemini-3.7-flash
  # Advisor: second model that reviews each turn and injects advice.
  advisor: anthropic/claude-sonnet-5:medium

# Order the model switcher cycles through.
cycleOrder:
  - smol
  - default
  - slow

# ---------------------------------------------------------------------------
# Thinking: default effort and per-level token budgets.
# ---------------------------------------------------------------------------
defaultThinkingLevel: high
thinkingBudgets:
  minimal: 1024
  low: 2048
  medium: 8192
  high: 16384
  xhigh: 32768
  max: 32768

# ---------------------------------------------------------------------------
# Retry + fallback: automatic step-down when a model errors or rate-limits.
# ---------------------------------------------------------------------------
retry:
  enabled: true
  maxRetries: 10
  baseDelayMs: 500
  maxDelayMs: 300000
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    # Any role without an explicit chain inherits "default".
    default:
      - anthropic/claude-sonnet-5
      - deepseek/deepseek-v4-pro-0813
      - deepseek/deepseek-v4-flash-0731
    slow:
      - anthropic/claude-opus-5
      - anthropic/claude-sonnet-5
      - deepseek/deepseek-v4-pro-0813
    plan:
      - anthropic/claude-opus-5
      - anthropic/claude-sonnet-5
    smol:
      - deepseek/deepseek-v4-flash-0731
      - deepseek/deepseek-v4-pro-0813
    vision:
      - google/gemini-3.7-flash
      - anthropic/claude-sonnet-5

# ---------------------------------------------------------------------------
# Tools and approvals.
# ---------------------------------------------------------------------------
tools:
  format: auto
  approvalMode: yolo
  maxTimeout: 0
  intentTracing: true

# Individual built-in tools.
bash:
  enabled: true
  autoBackground:
    enabled: false
    thresholdMs: 60000

eval:
  py: true
  js: true

lsp:
  enabled: true
  lazy: true
  diagnosticsOnWrite: true
  diagnosticsOnEdit: false
  formatOnWrite: false

edit:
  mode: hashline
  fuzzyMatch: true
  fuzzyThreshold: 0.95
  blockAutoGenerated: true

read:
  defaultLimit: 300
  summarize:
    enabled: true
    prose: false

grep:
  enabled: true

glob:
  enabled: true

fetch:
  enabled: true

web_search:
  enabled: true

browser:
  enabled: true

# ---------------------------------------------------------------------------
# Context compaction: keep long sessions alive without blowing the window.
# ---------------------------------------------------------------------------
compaction:
  enabled: true
  strategy: snapcompact
  midTurnEnabled: true
  thresholdPercent: 80
  thresholdTokens: -1
  remoteEnabled: true

# ---------------------------------------------------------------------------
# Memory.
# ---------------------------------------------------------------------------
memory:
  backend: off