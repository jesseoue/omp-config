# omp-config — agent settings (HIGHLY OPTIMIZED)
# Resolved from ~/.omp/agent/config.yml (see `omp config list` for every valid key).
#
# This is a tuned, speed-first profile: OpenRouter-only routing, lazy MCP
# discovery, adaptive-thinking effort levels, aggressive-but-safe fallback
# chains, and snapcompact context management — all wired for low latency and
# low token waste while keeping frontier reasoning on tap.
#
# Frontier reasoning is TOGGLEABLE. The slow/plan roles below default to the
# open-weight DeepSeek V4 Pro; swap to Claude Opus by setting FRONTIER_MODEL=opus
# (see models.yml).

# ---------------------------------------------------------------------------
# Model roles: which model each agent responsibility uses.
# Role values may carry a thinking suffix: :minimal :low :medium :high :xhigh :max
# ---------------------------------------------------------------------------
modelRoles:
  # Default model for general turns and the main agent loop.
  default: anthropic/claude-sonnet-5
  # Small/fast model for lightweight background tasks (titles, memory, etc).
  smol: deepseek/deepseek-v4-flash-0731
  # Slow/frontier model for hard problems and deep reasoning.
  # Open-weight default; set FRONTIER_MODEL=opus for the closed frontier.
  slow: deepseek/deepseek-v4-pro-0813:high
  # Planning model for scoping and architecture.
  # Open-weight default; set FRONTIER_MODEL=opus for the closed frontier.
  plan: deepseek/deepseek-v4-pro-0813
  # Vision model for image understanding.
  vision: google/gemini-3.7-flash
  # Advisor: second model that reviews each turn and injects advice.
  advisor: anthropic/claude-sonnet-5:medium

# Order the model switcher cycles through.
cycleOrder:
  - smol
  - default
  - slow

# ---------------------------------------------------------------------------
# Thinking: default effort and per-level token budgets.
# Claude 5 models use adaptive thinking (effort levels), not token budgets;
# these budgets still apply to budget-based models (DeepSeek, etc).
# ---------------------------------------------------------------------------
defaultThinkingLevel: high
thinkingBudgets:
  minimal: 1024
  low: 2048
  medium: 8192
  high: 16384
  xhigh: 32768
  max: 32768

# ---------------------------------------------------------------------------
# Retry + fallback: automatic step-down when a model errors or rate-limits.
# ---------------------------------------------------------------------------
retry:
  enabled: true
  maxRetries: 10
  baseDelayMs: 500
  maxDelayMs: 300000
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    # Any role without an explicit chain inherits "default".
    default:
      - anthropic/claude-sonnet-5
      - deepseek/deepseek-v4-pro-0813
      - deepseek/deepseek-v4-flash-0731
    slow:
      - deepseek/deepseek-v4-pro-0813
      - anthropic/claude-opus-5
      - anthropic/claude-sonnet-5
    plan:
      - deepseek/deepseek-v4-pro-0813
      - anthropic/claude-opus-5
      - anthropic/claude-sonnet-5
    smol:
      - deepseek/deepseek-v4-flash-0731
      - deepseek/deepseek-v4-pro-0813
    vision:
      - google/gemini-3.7-flash
      - anthropic/claude-sonnet-5

# ---------------------------------------------------------------------------
# Message queue: how concurrent steering/follow-up/interrupts are drained.
# one-at-a-time keeps the agent focused and avoids racing tool calls.
# ---------------------------------------------------------------------------
steeringMode: one-at-a-time
followUpMode: one-at-a-time
interruptMode: immediate

# ---------------------------------------------------------------------------
# Tools and approvals.
# ---------------------------------------------------------------------------
tools:
  format: auto
  # Discover MCP tools lazily to keep prompts small and tool calls fast.
  discoveryMode: mcp-only
  approvalMode: yolo
  maxTimeout: 0
  intentTracing: true

# Individual built-in tools.
bash:
  enabled: true
  autoBackground:
    enabled: false
    thresholdMs: 60000

eval:
  py: true
  js: true

lsp:
  enabled: true
  lazy: true
  diagnosticsOnWrite: true
  diagnosticsOnEdit: false
  formatOnWrite: false

edit:
  mode: hashline
  fuzzyMatch: true
  fuzzyThreshold: 0.95
  blockAutoGenerated: true

read:
  defaultLimit: 300
  summarize:
    enabled: true
    prose: false

grep:
  enabled: true

glob:
  enabled: true

fetch:
  enabled: true

web_search:
  enabled: true

browser:
  enabled: true

# ---------------------------------------------------------------------------
# Context compaction: keep long sessions alive without blowing the window.
# snapcompact = fast, lossless-ish snapshot compaction (lowest latency).
# ---------------------------------------------------------------------------
compaction:
  enabled: true
  strategy: snapcompact
  reserveTokens: 16384
  keepRecentTokens: 20000
  autoContinue: true
  idleEnabled: false
  midTurnEnabled: true
  thresholdPercent: 80
  thresholdTokens: -1
  remoteEnabled: true

# ---------------------------------------------------------------------------
# Memory.
# ---------------------------------------------------------------------------
memory:
  backend: off